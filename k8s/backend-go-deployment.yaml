apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-go-deployment
  labels:
    app: backend-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-go
  template:
    metadata:
      labels:
        app: backend-go
    spec:
      #serviceAccountName: backend-go-sa   # Use the KSA bound to GSA for secret access
      containers:
      - name: backend-go
        image: gcr.io/cosmic-bonus/backend-go:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4500
