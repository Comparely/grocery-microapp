apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comparely-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
  - host: app.comparely.co.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mobile-service
            port:
              number: 80
  - host: grocery-api.comparely.co.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-go-service
            port:
              number: 80
  tls:
  - hosts:
    - app.comparely.co.in
    - grocery-api.comparely.co.in
    secretName: comparely-tls
