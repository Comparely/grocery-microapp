apiVersion: apps/v1
kind: Deployment
metadata:
  name: ginger
spec:
  replicas: 0
  selector:
    matchLabels:
      app: ginger
  template:
    metadata:
      labels:
        app: ginger
    spec:
      containers:
        - name: ginger
          image: gcr.io/cosmic-bonus/ginger:latest
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: "34.118.230.24"
            - name: REDIS_PORT
              value: "6379"
