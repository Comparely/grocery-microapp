options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
steps:
  # Backend: Install, test, and build Docker image
  # Step 1: Build the Go backend binary (optional if using Docker build directly)
  - name: 'golang:1.24-alpine'
    id: 'Build backend-go binary'
    dir: 'backend-go'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        go mod download
        go build -o server .

  # Step 2: Build the Docker image for backend-go
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Docker Build Backend'
    dir: 'backend-go'
    args: ['build', '--no-cache', '-t', 'gcr.io/$PROJECT_ID/backend-go:latest', '.']

  # Step 3: Push the Docker image for backend-go
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Docker Push Backend'
    args: ['push', 'gcr.io/$PROJECT_ID/backend-go:latest']

  # ginger
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Docker Build Ginger'
    dir: 'ginger'
    args: ['build', '--no-cache', '-t', 'gcr.io/$PROJECT_ID/ginger:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Docker Push Ginger'
    args: ['push', 'gcr.io/$PROJECT_ID/ginger:latest']

  # Frontend: Install, build assets, and build Docker image
  - name: 'node:20'
    id: 'Frontend - Install & Build'
    env:
      - EXPO_PUBLIC_API_URL="https://grocery-api.comparely.co.in/"
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd mobile && npm install && npm run build-web

  - id: Write frontend .env
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        cat <<EOF > mobile/.env
        EXPO_PUBLIC_API_URL=${_EXPO_PUBLIC_API_URL}
        EXPO_PUBLIC_SUPPORT_WA_NUMBER=${_EXPO_PUBLIC_SUPPORT_WA_NUMBER}
        EOF
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Frontend - Build Docker Image'
    env:
      - EXPO_PUBLIC_API_URL="https://grocery-api.comparely.co.in/"
      - EXPO_PUBLIC_SUPPORT_WA_NUMBER="918076078942"
    args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/mobile:latest', './mobile' ]

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Frontend - Push Docker Image'
    args: [ 'push', 'gcr.io/$PROJECT_ID/mobile:latest' ]

  # Deploy to GKE using kubectl
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'Deploy to GKE'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=asia-south2-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=comparely-cluster'
    args:
      - 'apply'
      - '-f'
      - 'k8s'

substitutions:
  _EXPO_PUBLIC_API_URL: "https://grocery-api.comparely.co.in/"
  _EXPO_PUBLIC_SUPPORT_WA_NUMBER: "918076078942"

images:
  - 'gcr.io/$PROJECT_ID/backend-go:latest'
  - 'gcr.io/$PROJECT_ID/mobile:latest'
